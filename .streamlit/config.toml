# Colours of the app: HSG green and white.


[theme]
base = "light"
primaryColor = "#00802F"                  # buttons, ticked boxes, selected items, sliders
backgroundColor = "#FFFFFF"               # page
secondaryBackgroundColor = "#E9F4EC"      # input fields and boxes, light green
textColor = "#0F3D22"                     # text and headings, very dark green
linkColor = "#00802F"
borderColor = "#BFDDC9"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#D5EBDC"
chartCategoricalColors = ["#00802F", "#8E6CC0"]   # charts in green

[theme.sidebar]
backgroundColor = "#00802F"               # green sidebar
secondaryBackgroundColor = "#0E8F3C"
textColor = "#FFFFFF"
primaryColor = "#00501D"                  # dark green name chips, readable on the green
borderColor = "#3DA163"
